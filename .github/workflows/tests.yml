name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - name: Run approval-gated command acceptance loop
        shell: bash
        run: |
          mkdir -p workspace
          printf 'BEFORE' > workspace/acceptance.txt
          python -m ai_lab "把工作區的 acceptance.txt 內容改成 DONE。" --approve | tee acceptance-output.txt
          test "$(cat workspace/acceptance.txt)" = "DONE"
          grep -q "AI Lab 執行計劃" acceptance-output.txt
          grep -q "獨立驗證：PASS" acceptance-output.txt
          grep -q "最終狀態：verified_complete" acceptance-output.txt
          python - <<'PY'
          import json
          from pathlib import Path

          receipts = sorted(Path('.ai-lab/runs').glob('*/receipt.json'))
          assert receipts, 'receipt.json was not created'
          data = json.loads(receipts[-1].read_text(encoding='utf-8'))
          assert data['final_status'] == 'verified_complete'
          assert data['changed'] is True
          assert data['verified'] is True
          assert data['task']['relative_path'] == 'acceptance.txt'
          assert data['task']['text'] == 'DONE'
          PY
